name: Build CIA

# Builds ClaudeFor3DS.cia and ClaudeFor3DS.3dsx on every push. On main, the CIA is
# committed to the repository root with "[skip ci]" so that commit does not build again.
on:
  push:
    branches: ['**']
    paths-ignore:
      - 'ClaudeFor3DS.cia'
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Belt and braces: never build the bot's own CIA commit.
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Install host tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git curl unzip xz-utils python3 file ca-certificates

      - name: Check out
        uses: actions/checkout@v4

      - name: Install makerom and bannertool
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/install_cia_tools.sh /usr/local/bin

      - name: Build
        run: |
          printf '{"sha":"%s","time":%s}\n' "$GITHUB_SHA" "$(date +%s)" > romfs/build_info.json
          make -j"$(nproc)"
          ls -la ClaudeFor3DS.cia ClaudeFor3DS.3dsx

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: ClaudeFor3DS-${{ github.sha }}
          path: |
            ClaudeFor3DS.cia
            ClaudeFor3DS.3dsx

      - name: Commit ClaudeFor3DS.cia to main
        if: github.ref == 'refs/heads/main'
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f ClaudeFor3DS.cia
          if git diff --cached --quiet; then
            echo "ClaudeFor3DS.cia is unchanged."
            exit 0
          fi
          git commit -m "Update ClaudeFor3DS.cia for ${GITHUB_SHA::7} [skip ci]"
          for attempt in 1 2 3 4; do
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push rejected, rebasing onto the latest main (attempt ${attempt})"
            git pull --rebase -X theirs origin main
            sleep $((attempt * 5))
          done
          exit 1
